<script>
/* 语言分流：先认用户选过的语言，其次浏览器语言；meta refresh 兜底。 */
(function(){
  var lang = '';
  try { lang = localStorage.getItem('xueai_lang') || ''; } catch(e) {}
  if (!lang) {
    var nav = (navigator.language || '').toLowerCase();
    if (nav.indexOf('ko') === 0) lang = 'ko';
    else if (nav.indexOf('zh') === 0) lang = 'zh';
    else lang = 'en';
  }
  window.location.replace(lang === 'zh' ? 'slides/learn.html' : 'slides/learn.' + lang + '.html');
})();
</script>
